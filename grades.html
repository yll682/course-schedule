<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>查询成绩 - 课程表</title>
    <link rel="stylesheet" href="/ibm-plex-sans-sc.css">
    <link rel="stylesheet" href="/style.css">
    <style>
        body { padding: 16px 16px 40px; }
        main { max-width: 900px; margin: auto; }
        header { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
        h1 { font-size: 1.2rem; margin: 0; }
        a { color: var(--c-accent); }
        button, select, .back-link {
            font: inherit; color: var(--c-text); background: var(--c-surface);
            border: 1px solid var(--c-border-input); border-radius: 8px; padding: 9px 12px;
        }
        .back-link { text-decoration: none; white-space: nowrap; }
        button { cursor: pointer; }
        button:disabled, select:disabled { opacity: .6; cursor: default; }
        :focus-visible { outline: 2px solid var(--c-accent); outline-offset: 3px; }
        .filters { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        select { flex: 1; min-width: 150px; }
        .filter-toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; white-space: nowrap; }
        .filter-toggle input { position: absolute; width: 1px; height: 1px; opacity: 0; }
        .toggle-track { width: 38px; height: 22px; padding: 2px; border-radius: 999px; background: var(--c-border-input); transition: background .15s; }
        .toggle-track::after { content: ''; display: block; width: 18px; height: 18px; border-radius: 50%; background: var(--c-surface); box-shadow: 0 1px 3px rgba(0,0,0,.24); transition: transform .15s; }
        .filter-toggle input:checked + .toggle-track { background: var(--c-primary); }
        .filter-toggle input:checked + .toggle-track::after { transform: translateX(16px); }
        .filter-toggle input:focus-visible + .toggle-track { outline: 2px solid var(--c-accent); outline-offset: 3px; }
        .filter-toggle input:disabled + .toggle-track { opacity: .55; }
        #status { line-height: 1.7; margin: 20px 0; }
        #summary { display: flex; gap: 12px 24px; flex-wrap: wrap; padding: 16px; margin: 20px 0; background: var(--c-surface); border-radius: 12px; }
        #summary[hidden], [hidden] { display: none; }
        .table-wrap { overflow-x: auto; border: 1px solid var(--c-border); border-radius: 12px; background: var(--c-surface); }
        table { border-collapse: collapse; width: 100%; text-align: left; font-size: .9rem; }
        caption { text-align: left; padding: 16px; font-weight: 600; }
        th, td { padding: 12px 14px; border-top: 1px solid var(--c-border-soft); }
        th { background: var(--c-subtle); white-space: nowrap; }
        td { min-width: 80px; }
        td:first-child { min-width: 180px; overflow-wrap: anywhere; }
        td:nth-child(2) { font-weight: 600; color: var(--c-accent); }
        .course-code { display: block; color: var(--c-hint); font-size: .75rem; margin-top: 4px; }
        td.failing-grade { color: #cf1322; }
        .admin-view { padding: 10px 14px; margin: 0 0 18px; border: 1px solid #91caff; border-radius: 8px; background: #e6f4ff; color: #0958d9; }
        .hint { color: var(--c-hint); font-size: .85rem; line-height: 1.7; }
        @media (prefers-color-scheme: dark) {
            td.failing-grade { color: #ff7875; }
            .admin-view { border-color: #15395b; background: #111d2c; color: #69b1ff; }
        }
    </style>
    <script src="/grades.js" defer></script>
</head>
<body>
    <main>
        <header><a class="back-link" id="back-link" href="/">← 课程表</a><h1 id="page-title">查询成绩</h1></header>
        <p class="admin-view" id="admin-view" hidden></p>
        <div class="filters">
            <label for="semester">学期</label>
            <select id="semester" disabled><option value="">正在获取学期…</option></select>
            <label class="filter-toggle">
                <input id="best-only" type="checkbox" disabled>
                <span class="toggle-track" aria-hidden="true"></span>
                <span>仅显示最高成绩</span>
            </label>
            <button id="refresh" type="button" disabled>刷新成绩</button>
        </div>
        <p id="status" role="status" aria-live="polite">正在获取学期…</p>
        <p id="login-help" hidden><a href="/login.html">重新登录</a></p>
        <section id="results" aria-label="学期成绩" aria-busy="true">
            <div id="summary" hidden></div>
            <div id="table-wrap" class="table-wrap" hidden tabindex="0" aria-label="成绩表，可横向滚动">
                <table>
                    <caption id="grades-caption"></caption>
                    <thead><tr><th scope="col">课程</th><th scope="col">成绩</th><th scope="col">学分</th><th scope="col">课程属性</th><th scope="col">课程性质</th><th scope="col">考试性质</th></tr></thead>
                    <tbody id="grades-body"></tbody>
                </table>
            </div>
        </section>
        <p class="hint">成绩与统计数据来自教务系统。手机上可以横向滚动查看完整表格。</p>
    </main>
</body>
</html>
